project: "hm_genrec"
program: scripts/train.py
method: bayes
metric:
  name: val/map_at_12
  goal: maximize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  lora_r:
    values: [8, 16, 32]
  lora_dropout:
    values: [0.05, 0.1]

  # --- FIXED PARAMETERS FOR LOCAL TESTING ---
  batch_size:
    value: 24
  data_path:
    value: "data/processed/train_full.parquet"
  epochs:
    value: 1
  max_train_steps:
    value: 2000
  max_val_steps:
    value: 400

command:
  - ${env}
  - python
  - ${program}
  - ${args}
